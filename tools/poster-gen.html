<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>poster gen</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  body { margin: 0; background: #fff; }
  model-viewer { width: 512px; height: 512px; --poster-color: transparent; }
</style>
</head>
<body>
<model-viewer id="mv" camera-orbit="28deg 68deg auto" shadow-intensity="0" exposure="1.15" environment-image="neutral" disable-zoom></model-viewer>
<script>
  const mv = document.getElementById('mv');
  window.renderModel = (src) => new Promise((resolve, reject) => {
    const onLoad = () => {
      mv.removeEventListener('load', onLoad);
      // let the renderer settle before grabbing the frame
      requestAnimationFrame(() => requestAnimationFrame(() => {
        setTimeout(() => resolve(mv.toDataURL('image/png')), 220);
      }));
    };
    mv.addEventListener('load', onLoad);
    mv.addEventListener('error', reject, { once: true });
    mv.src = src;
  });
</script>
</body>
</html>
